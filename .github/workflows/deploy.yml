name: Deploy Spendora

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/Spendora
            git pull origin main

            docker build \
              --build-arg NEXT_PUBLIC_LARAVEL_API_URL=http://10.50.17.27:8000 \
              -t spendora:latest .

            docker stop spendora || true
            docker rm spendora || true

            docker run -d \
              --name spendora \
              -p 3000:3000 \
              --restart unless-stopped \
              spendora:latest
